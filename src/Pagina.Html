<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enviar Texto al ESP32</title>
</head>
<body>
    <h2>Enviar Texto al ESP32</h2>
    <form id="textoForm">
        <label for="texto">Ingresa el texto:</label>
        <input type="text" id="texto" name="texto" required>
        <button type="submit">Enviar</button>
    </form>
    <p id="respuesta"></p>

    <script>
        document.getElementById("textoForm").addEventListener("submit", function(event) {
            event.preventDefault();

            // Capturar el texto ingresado
            const texto = document.getElementById("texto").value;

            // Enviar la solicitud al ESP32
            fetch(`http://192.168.137.6/?texto=${encodeURIComponent(texto)}`)
                .then(response => response.text())
                .then(data => {
                    // Mostrar la respuesta del ESP32 en el navegador
                    document.getElementById("respuesta").innerText = data;
                })
                .catch(error => {
                    console.error("Error al enviar el texto:", error);
                    document.getElementById("respuesta").innerText = "Error al enviar el texto.";
                });
        });
    </script>
</body>
</html>
