<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enviar Texto al ESP32</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #f0f4f8, #d0e1f9);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
        }

        .container {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            padding: 40px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            transition: transform 0.3s;
        }

        .container:hover {
            transform: translateY(-5px);
        }

        h2 {
            color: #3498db;
            margin-bottom: 20px;
            font-size: 24px;
        }

        label {
            font-weight: 700;
            font-size: 14px;
            color: #555;
            display: block;
            margin-bottom: 8px;
            text-align: left;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 16px;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            border-color: #3498db;
            box-shadow: 0 0 8px rgba(52, 152, 219, 0.2);
            outline: none;
        }

        button {
            background-color: #3498db;
            color: #fff;
            border: none;
            padding: 14px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background-color 0.3s, transform 0.2s;
        }

        button:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        #respuesta {
            margin-top: 20px;
            font-weight: bold;
            color: #333;
        }

        #confirmacion {
            margin-top: 20px;
            color: #e67e22;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        #confirmacion button {
            padding: 10px 18px;
            background-color: #e74c3c;
            border-radius: 8px;
            font-size: 14px;
            color: white;
            transition: background-color 0.3s;
        }

        #confirmacion button:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Enviar Texto al ESP32</h2>
        <form id="textoForm">
            <label for="texto">Ingresa el texto:</label>
            <input type="text" id="texto" name="texto" required>
            <button id="enviarBtn" type="submit">Enviar</button>
        </form>
        <p id="respuesta"></p>
        <div id="confirmacion" style="display:none;"></div>
    </div>

    <script>
        document.getElementById("textoForm").addEventListener("submit", function(event) {
            event.preventDefault();

            const texto = document.getElementById("texto").value;
            document.getElementById("enviarBtn").disabled = true;

            const confirmacion = document.getElementById("confirmacion");
            confirmacion.innerHTML = `
                <p>¿Está seguro de enviar el siguiente texto: <strong>${texto}</strong>?</p>
                <button id="confirmarBtn">Confirmar</button>
                <button id="cancelarBtn">Cancelar</button>
            `;
            confirmacion.style.display = "flex";

            document.getElementById("confirmarBtn").onclick = function() {
                fetch(`http://192.168.137.127/?texto=${encodeURIComponent(texto)}`)
                    .then(response => response.text())
                    .then(data => {
                        document.getElementById("respuesta").innerText = data;
                        document.getElementById("enviarBtn").disabled = false;
                        confirmacion.style.display = "none";
                    })
                    .catch(error => {
                        console.error("Error:", error);
                        document.getElementById("respuesta").innerText = "";
                        document.getElementById("enviarBtn").disabled = false;
                        confirmacion.style.display = "none";
                    });
            };

            document.getElementById("cancelarBtn").onclick = function() {
                confirmacion.style.display = "none";
                document.getElementById("enviarBtn").disabled = false;
            };
        });
    </script>
</body>
</html>
